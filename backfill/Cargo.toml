[package]
name = "backfill"
version = "0.1.0"
edition = "2021"
description = "Streams Old Faithful CAR archives and keeps pump.fun program transactions"

[dependencies]
callout-board = { path = ".." }
jetstreamer-firehose = "0.8.1"
solana-transaction-status = "4"
anyhow = "1"
bs58 = "0.5"
futures = "0.3"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zstd = "0.13"
