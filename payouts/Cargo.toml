[package]
name = "payouts"
version = "0.1.0"
edition = "2021"
description = "Ingests pump.fun callout reward payouts over RPC and reports on them"

[dependencies]
callout-board = { path = ".." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zstd = "0.13"
